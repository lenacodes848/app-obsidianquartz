name: local-server tests

on:
  push:
    branches: [main]
    paths:
      - "local-server/**"
      - ".github/workflows/local-server-tests.yml"
  pull_request:
    paths:
      - "local-server/**"
      - ".github/workflows/local-server-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test
