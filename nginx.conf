server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression. gzip_proxied is the one that actually matters in this
    # deployment: every real request arrives via Traefik, not directly, and
    # nginx's gzip module treats proxied requests conservatively unless told
    # otherwise — "any" is what makes compression apply to real traffic
    # instead of silently only working on a direct `docker run` preview.
    # Already-compressed formats (images, woff2) are deliberately left out of
    # gzip_types: re-compressing them wastes CPU for zero (sometimes
    # negative) size benefit. text/html doesn't need listing — nginx always
    # compresses it once gzip is on.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        # Both text/xml and application/xml are listed deliberately, not
        # redundantly: the stock mime.types shipped with this base image maps
        # a bare .xml extension (sitemap.xml, the RSS feed) to text/xml, not
        # application/xml — Quartz's ContentIndex emitter writes both files
        # with that plain extension. application/xml stays too as a
        # safety net for any XML served under that type by other means.
        text/xml
        application/xml
        image/svg+xml;

    # SPA-ish fallback so clean URLs / 404s resolve to Quartz's 404 page if present
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long cache for static assets, short for HTML
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # No write methods, no directory listing
    autoindex off;
    server_tokens off;
}
